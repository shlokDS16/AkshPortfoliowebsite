name: pump

# Primary clock (ADR-001 s8.2): every 15 minutes. GitHub may delay scheduled runs under load
# and disables them after 60 days without repository activity; the Vercel daily cron and the
# external uptime monitor on /api/health cover those gaps.
# Off-peak minutes (7, 22, 37, 52), not */15: GitHub's busiest slots are :00/:15/:30/:45, where it
# drops queued scheduled runs; */15 never fired once in the 5 hours after enabling (2026-10-14).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DESK_URL     production origin, e.g. https://desk.example.com (no trailing slash needed)
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

# Two pumps never overlap: a late run waits for the one in flight instead of cancelling it.
concurrency:
  group: pump
  cancel-in-progress: false

jobs:
  pump:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: POST /api/jobs/run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DESK_URL: ${{ secrets.DESK_URL }}
        run: |
          set -euo pipefail
          : "${DESK_URL:?repository secret DESK_URL is not set}"
          : "${CRON_SECRET:?repository secret CRON_SECRET is not set}"
          curl -sS --fail-with-body --max-time 280 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${DESK_URL%/}/api/jobs/run"
          echo
